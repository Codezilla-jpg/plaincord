[project]
name = "plaincord"
version = "0.1.0"
description = "A clean Discord TUI: servers, channels, chat, and voice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Codezilla-jpg" }]
keywords = ["discord", "tui", "cli", "terminal", "voice"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "textual>=2.0",
  "discord.py>=2.5",
  "keyring>=25.0",
  "PyNaCl>=1.5",
]

[project.urls]
Homepage = "https://github.com/Codezilla-jpg/plaincord"
Issues = "https://github.com/Codezilla-jpg/plaincord/issues"

[project.scripts]
plaincord = "plaincord.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/plaincord"]

[tool.hatch.build.targets.wheel.force-include]
"src/plaincord/app.tcss" = "plaincord/app.tcss"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
